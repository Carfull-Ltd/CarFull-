workflows:
  carfull-ios:
    name: CarFull iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      node: 22
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Generate Capacitor iOS project
        script: npm run prepare:ios
      - name: Verify iOS project
        script: |
          test -d ios/App/App.xcworkspace
          echo "CarFull iOS project generated successfully"
    artifacts:
      - ios/App/App.xcworkspace/**
      - ios/App/App.xcodeproj/**
      - /tmp/xcodebuild_logs/*.log

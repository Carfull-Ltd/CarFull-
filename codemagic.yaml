workflows:
  carfull-ios:
    name: CarFull iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: CarFull Ltd 2

    environment:
      xcode: latest
      node: 22
      ios_signing:
        distribution_type: app_store
        bundle_identifier: uk.co.carfull.app

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Generate Capacitor iOS project
        script: npm run prepare:ios

      - name: Apply iOS signing
        script: |
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/App/App.xcworkspace" \
            --scheme "App"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
